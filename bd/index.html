<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Traditional Baduk (Go) - Classic Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 25%, #3a2618 0%, #1c110a 100%);
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
            color: #f5efe6;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        .serif-title {
            font-family: 'Noto Serif KR', serif;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
        }
        .btn-wood {
            background: linear-gradient(180deg, #c68b3c 0%, #996521 100%);
            border: 1.5px solid #e6b873;
            color: #fffdf9;
            box-shadow: 0 3px 0 #5c3a11, 0 4px 10px rgba(0, 0, 0, 0.45);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.15s;
        }
        .btn-wood:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }
        .btn-wood:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #5c3a11, 0 2px 5px rgba(0, 0, 0, 0.4);
        }
        .btn-amber {
            background: linear-gradient(180deg, #b45309 0%, #78350f 100%);
            border: 1.5px solid #f59e0b;
            color: #fef3c7;
            box-shadow: 0 3px 0 #451a03, 0 4px 10px rgba(0, 0, 0, 0.45);
        }
        .btn-amber:active {
            box-shadow: 0 1px 0 #451a03;
        }
        .btn-crimson {
            background: linear-gradient(180deg, #991b1b 0%, #7f1d1d 100%);
            border: 1.5px solid #fca5a5;
            color: #fef2f2;
            box-shadow: 0 3px 0 #450a0a, 0 4px 10px rgba(0, 0, 0, 0.45);
        }
        .btn-crimson:active {
            box-shadow: 0 1px 0 #450a0a;
        }
        #game-container {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }
        .float-badge {
            animation: floatAnim 3.5s ease-in-out infinite;
        }
    </style>
</head>
<body>

        <!-- Bottom-Left Brand Badge -->
        <a href="https://gameplez.com" target="_blank" rel="noopener noreferrer" title="Play more games on GAMEPLEZ.COM"
           class="float-badge absolute bottom-3 left-3 z-20 flex items-center gap-2 bg-[#23150c]/90 hover:bg-[#2d1b10] backdrop-blur-md border border-amber-700/60 pl-2 pr-3 py-1.5 rounded-2xl shadow-xl cursor-pointer">

        <!-- Game Setup Modal -->

                <!-- Baduk Stones on Top -->
                <div class="flex items-center justify-center gap-3 mb-2.5">
                    <span class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-gradient-to-br from-neutral-500 via-neutral-900 to-black border border-neutral-500/80 shadow-[0_4px_10px_rgba(0,0,0,0.65)] inline-block"></span>
                    <span class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-gradient-to-br from-white via-stone-100 to-stone-300 border border-stone-300 shadow-[0_4px_10px_rgba(0,0,0,0.65)] inline-block"></span>

    <script>
        /**
         * TRADITIONAL BADUK - Authentic Go Rules & Kaya Wood Graphics
         */

        // --- Traditional Stone Placement Sound Engine (Web Audio API) ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggleMute() {
                this.muted = !this.muted;
                return this.muted;
            }

            // Crisp 'clack' sound of a stone landing on a Kaya wood board
            playPlace() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;

                // 1. Wood resonance (low-end body)
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(240, now);
                osc.frequency.exponentialRampToValueAtTime(85, now + 0.065);
                gain.gain.setValueAtTime(0.45, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);

                // 2. Stone/shell impact click (short high-frequency burst)
                const bufferSize = this.ctx.sampleRate * 0.025;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
                }
                const whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1800;
                filter.Q.value = 1.5;

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.5, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.025);

                whiteNoise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);
                whiteNoise.start(now);
            }

            // Sound when capturing stones
            playCapture() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                [320, 440].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.045);
                    osc.frequency.exponentialRampToValueAtTime(140, now + i * 0.045 + 0.09);
                    gain.gain.setValueAtTime(0.3, now + i * 0.045);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.045 + 0.1);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.045);
                    osc.stop(now + i * 0.045 + 0.11);
                });
            }

            // Game over chime
            playWin() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                [392.00, 493.88, 587.33, 783.99].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.35);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.36);
                });
            }
        }

        const sound = new SoundEngine();

        // --- Game Variables & State ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');

        const LEVEL_LABELS = {
            1: 'Very Easy',
            2: 'Easy',
            3: 'Casual',
            4: 'Beginner+',
            5: 'Balanced',
            6: 'Skilled',
            7: 'Strong',
            8: 'Expert',
            9: 'Master',
            10: 'Grandmaster'
        };

        let boardSize = 9;
        let playerColor = 1; // 1: Black, 2: White
        let aiDifficulty = 5; // 1 (easiest) to 10 (hardest)
        let board = [];
        let turn = 1;
        let captures = { 1: 0, 2: 0 };
        let koPoint = null;
        let consecutivePasses = 0;
        let gameOver = false;
        let lastMove = null;
        let hoverCoord = null;
        let aiTimeout = null;

        let width = 0;
        let height = 0;
        let boardPixelSize = 0;
        let cellSize = 0;
        let boardOffsetX = 0;
        let boardOffsetY = 0;

        // --- Board Initialization ---
        function initBoard() {
            if (aiTimeout) clearTimeout(aiTimeout);
            board = Array(boardSize).fill(0).map(() => Array(boardSize).fill(0));
            turn = 1;
            captures = { 1: 0, 2: 0 };
            koPoint = null;
            consecutivePasses = 0;
            gameOver = false;
            lastMove = null;
            hoverCoord = null;
            document.getElementById('result-text-panel').classList.add('hidden');
            updateHUD();
            resizeCanvas();

            if (playerColor === 2 && turn !== playerColor && !gameOver) {
                aiTimeout = setTimeout(makeAIMove, 450);
            }
        }

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = rect.width;
            height = rect.height;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const reservedBottom = gameOver ? 135 : 30;
            const maxDim = Math.min(width, height - reservedBottom) * 0.85;
            boardPixelSize = maxDim;
            cellSize = boardPixelSize / (boardSize + 0.6);
            boardOffsetX = (width - (boardSize - 1) * cellSize) / 2;
            boardOffsetY = (height - reservedBottom - (boardSize - 1) * cellSize) / 2;
        }

        // --- Go Rules Engine ---
        function getNeighbors(r, c) {
            const neighbors = [];
            if (r > 0) neighbors.push({ r: r - 1, c });
            if (r < boardSize - 1) neighbors.push({ r: r + 1, c });
            if (c > 0) neighbors.push({ r, c: c - 1 });
            if (c < boardSize - 1) neighbors.push({ r, c: c + 1 });
            return neighbors;
        }

        function getGroup(r, c, bState) {
            const color = bState[r][c];
            if (color === 0) return { stones: [], liberties: new Set() };

            const visited = Array(boardSize).fill(0).map(() => Array(boardSize).fill(false));
            const stones = [];
            const liberties = new Set();
            const queue = [{ r, c }];
            visited[r][c] = true;

            while (queue.length > 0) {
                const curr = queue.pop();
                stones.push(curr);

                for (const n of getNeighbors(curr.r, curr.c)) {
                    const nColor = bState[n.r][n.c];
                    if (nColor === 0) {
                        liberties.add(`${n.r},${n.c}`);
                    } else if (nColor === color && !visited[n.r][n.c]) {
                        visited[n.r][n.c] = true;
                        queue.push(n);
                    }
                }
            }
            return { stones, liberties };
        }

        function isValidMove(r, c, player) {
            if (board[r][c] !== 0 || gameOver) return false;
            if (koPoint && koPoint.r === r && koPoint.c === c) return false;

            const testBoard = board.map(row => [...row]);
            testBoard[r][c] = player;
            const oppColor = player === 1 ? 2 : 1;

            let capturedStonesCount = 0;
            const capturedGroups = [];

            for (const n of getNeighbors(r, c)) {
                if (testBoard[n.r][n.c] === oppColor) {
                    const group = getGroup(n.r, n.c, testBoard);
                    if (group.liberties.size === 0) {
                        capturedGroups.push(group);
                    }
                }
            }

            for (const group of capturedGroups) {
                for (const st of group.stones) {
                    if (testBoard[st.r][st.c] !== 0) {
                        testBoard[st.r][st.c] = 0;
                        capturedStonesCount++;
                    }
                }
            }

            const playerGroup = getGroup(r, c, testBoard);
            if (playerGroup.liberties.size === 0 && capturedStonesCount === 0) {
                return false;
            }

            return true;
        }

        function isOwnEye(r, c, player) {
            const neighbors = getNeighbors(r, c);
            if (neighbors.length === 0) return false;
            for (const n of neighbors) {
                if (board[n.r][n.c] !== player) return false;
            }
            return true;
        }

        function playMove(r, c, player) {
            if (!isValidMove(r, c, player)) return false;

            const oppColor = player === 1 ? 2 : 1;
            board[r][c] = player;

            let capturedStonesCount = 0;
            const capturedGroups = [];

            for (const n of getNeighbors(r, c)) {
                if (board[n.r][n.c] === oppColor) {
                    const group = getGroup(n.r, n.c, board);
                    if (group.liberties.size === 0) {
                        capturedGroups.push(group);
                    }
                }
            }

            let lastCapturedSingle = null;
            for (const group of capturedGroups) {
                if (group.stones.length === 1) {
                    lastCapturedSingle = group.stones[0];
                }
                for (const st of group.stones) {
                    board[st.r][st.c] = 0;
                    capturedStonesCount++;
                }
            }

            captures[player] += capturedStonesCount;

            if (capturedStonesCount === 1 && lastCapturedSingle) {
                const myGroup = getGroup(r, c, board);
                if (myGroup.stones.length === 1 && myGroup.liberties.size === 1) {
                    koPoint = lastCapturedSingle;
                } else {
                    koPoint = null;
                }
            } else {
                koPoint = null;
            }

            lastMove = { r, c };
            consecutivePasses = 0;

            if (capturedStonesCount > 0) {
                sound.playCapture();
            } else {
                sound.playPlace();
            }

            turn = oppColor;
            updateHUD();

            if (checkAutoEndGameCondition()) return true;

            if (turn !== playerColor && !gameOver) {
                aiTimeout = setTimeout(makeAIMove, 350);
            }

            return true;
        }

        function passTurn() {
            if (gameOver) return;
            consecutivePasses++;
            sound.playPlace();
            koPoint = null;
            lastMove = null;

            if (consecutivePasses >= 2 || turn !== playerColor) {
                endGame();
                return;
            }

            turn = turn === 1 ? 2 : 1;
            updateHUD();

            if (turn !== playerColor && !gameOver) {
                aiTimeout = setTimeout(makeAIMove, 350);
            }
        }

        function resignGame() {
            if (gameOver) return;
            if (aiTimeout) clearTimeout(aiTimeout);
            gameOver = true;
            sound.playCapture();
            resizeCanvas();
            showResultText(playerColor === 1 ? 2 : 1, "You resigned. Opponent wins by resignation!");
        }

        function checkAutoEndGameCondition() {
            if (gameOver) return true;
            let emptyCount = 0;
            let meaningfulMovesForCurrent = 0;

            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    if (board[r][c] === 0) {
                        emptyCount++;
                        if (isValidMove(r, c, turn) && !isOwnEye(r, c, turn)) {
                            meaningfulMovesForCurrent++;
                        }
                    }
                }
            }

            const totalCells = boardSize * boardSize;
            if (meaningfulMovesForCurrent === 0 || emptyCount <= Math.max(3, Math.floor(totalCells * 0.12))) {
                endGame();
                return true;
            }
            return false;
        }

        function makeAIMove() {
            if (gameOver || turn === playerColor) return;

            const lvl = Math.max(1, Math.min(10, aiDifficulty));
            const skillFactor = (lvl - 1) / 9; // 0.0 at Lv. 1 -> 1.0 at Lv. 10
            const oppColor = turn === 1 ? 2 : 1;

            const starPoints = boardSize === 9 ? [{r:2,c:2},{r:2,c:6},{r:4,c:4},{r:6,c:2},{r:6,c:6}] :
                               boardSize === 13 ? [{r:3,c:3},{r:3,c:9},{r:6,c:6},{r:9,c:3},{r:9,c:9}] :
                               [{r:3,c:3},{r:3,c:9},{r:3,c:15},{r:9,c:3},{r:9,c:9},{r:9,c:15},{r:15,c:3},{r:15,c:9},{r:15,c:15}];
            const center = (boardSize - 1) / 2;

            const validMoves = [];
            let stoneCount = 0;
            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    if (board[r][c] !== 0) stoneCount++;
                    if (isValidMove(r, c, turn) && !isOwnEye(r, c, turn)) {
                        const testBoard = board.map(row => [...row]);
                        testBoard[r][c] = turn;
                        let score = 10;

                        // 1. Capturing opponent stones
                        let capturesMade = 0;
                        let atariSavedOrCreated = 0;
                        for (const n of getNeighbors(r, c)) {
                            if (testBoard[n.r][n.c] === oppColor) {
                                const oppGrp = getGroup(n.r, n.c, testBoard);
                                if (oppGrp.liberties.size === 0) {
                                    capturesMade += oppGrp.stones.length;
                                } else if (oppGrp.liberties.size === 1) {
                                    atariSavedOrCreated += oppGrp.stones.length;
                                }
                            }
                        }
                        score += capturesMade * (28 + skillFactor * 26);
                        score += atariSavedOrCreated * (4 + skillFactor * 14);

                        // 2. Own group liberties & self-atari penalty
                        const myGrp = getGroup(r, c, testBoard);
                        if (myGrp.liberties.size === 1 && capturesMade === 0) {
                            score -= (8 + skillFactor * 34);
                        } else {
                            score += Math.min(myGrp.liberties.size, 5) * (2 + skillFactor * 4.5);
                        }

                        // 3. Star points & opening/midgame influence
                        if (starPoints.some(pt => pt.r === r && pt.c === c)) {
                            score += (8 + skillFactor * 16);
                        }

                        const distFromCenter = Math.hypot(r - center, c - center);
                        const edgeDist = Math.min(r, c, boardSize - 1 - r, boardSize - 1 - c);
                        if (skillFactor > 0.25) {
                            // Prefer 3rd/4th line territory & balanced expansion
                            if (edgeDist >= 2 && edgeDist <= 3) {
                                score += skillFactor * 6;
                            }
                            score += Math.max(0, (boardSize * 0.45 - distFromCenter)) * skillFactor * 1.2;
                        }

                        // 4. Connection / adjacency bonus at higher levels
                        let friendlyAdj = 0;
                        let enemyAdj = 0;
                        for (const n of getNeighbors(r, c)) {
                            if (testBoard[n.r][n.c] === turn) friendlyAdj++;
                            else if (testBoard[n.r][n.c] === oppColor) enemyAdj++;
                        }
                        score += friendlyAdj * (1.5 + skillFactor * 4.5);
                        if (enemyAdj > 0 && skillFactor > 0.4) {
                            score += enemyAdj * skillFactor * 3;
                        }

                        // 5. Level-scaled randomness: Lv. 1 is very random; Lv. 10 is nearly deterministic
                        const noiseScale = Math.pow(1 - skillFactor, 1.55) * 75 + (1 - skillFactor) * 5;
                        score += Math.random() * noiseScale;

                        validMoves.push({ r, c, score });
                    }
                }
            }

            const totalCells = boardSize * boardSize;
            const captureDiff = captures[playerColor] - captures[turn];
            // Lower levels resign less readily; higher levels resign earlier when hopelessly behind
            const resignThreshold = Math.max(
                Math.floor(boardSize * 0.85),
                Math.floor(boardSize * (1.65 - skillFactor * 0.75))
            );
            const isHopelesslyBehind = (stoneCount > totalCells * 0.48 && captureDiff >= resignThreshold);

            if (validMoves.length === 0 || isHopelesslyBehind) {
                if (isHopelesslyBehind && validMoves.length > 0) {
                    gameOver = true;
                    sound.playWin();
                    resizeCanvas();
                    const scores = computeScores();
                    showResultText(playerColor, "AI resigned (Win by resignation)!", scores);
                } else {
                    endGame();
                }
                return;
            }

            validMoves.sort((a, b) => b.score - a.score);

            // At very low levels (1-3), occasionally pick from top candidates instead of #1
            let chosenIdx = 0;
            if (lvl <= 3 && validMoves.length > 1) {
                const poolSize = Math.min(validMoves.length, 6 - lvl);
                if (Math.random() < (4 - lvl) * 0.22) {
                    chosenIdx = Math.floor(Math.random() * poolSize);
                }
            }

            const bestMove = validMoves[chosenIdx];
            playMove(bestMove.r, bestMove.c, turn);
        }

        function computeScores() {
            let blackTerritory = 0;
            let whiteTerritory = 0;
            const visited = Array(boardSize).fill(0).map(() => Array(boardSize).fill(false));

            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    if (board[r][c] === 0 && !visited[r][c]) {
                        const region = [];
                        const queue = [{ r, c }];
                        visited[r][c] = true;
                        let touchesBlack = false;
                        let touchesWhite = false;

                        while (queue.length > 0) {
                            const curr = queue.pop();
                            region.push(curr);

                            for (const n of getNeighbors(curr.r, curr.c)) {
                                const owner = board[n.r][n.c];
                                if (owner === 1) touchesBlack = true;
                                else if (owner === 2) touchesWhite = true;
                                else if (owner === 0 && !visited[n.r][n.c]) {
                                    visited[n.r][n.c] = true;
                                    queue.push(n);
                                }
                            }
                        }

                        if (touchesBlack && !touchesWhite) blackTerritory += region.length;
                        if (touchesWhite && !touchesBlack) whiteTerritory += region.length;
                    }
                }
            }

            const komi = 6.5;
            const blackStones = board.flat().filter(x => x === 1).length;
            const whiteStones = board.flat().filter(x => x === 2).length;

            const blackScore = blackStones + blackTerritory + captures[1];
            const whiteScore = whiteStones + whiteTerritory + captures[2] + komi;
            const blackWon = blackScore > whiteScore;
            const diff = Math.abs(blackScore - whiteScore).toFixed(1);

            return {
                blackStones, blackTerritory, blackCaptures: captures[1], blackScore,
                whiteStones, whiteTerritory, whiteCaptures: captures[2], komi, whiteScore,
                blackWon, diff,
                winnerColor: blackWon ? 1 : 2,
                winnerName: blackWon ? 'Black' : 'White'
            };
        }

        function endGame() {
            if (gameOver) return;
            if (aiTimeout) clearTimeout(aiTimeout);
            gameOver = true;
            sound.playWin();
            resizeCanvas();

            const scores = computeScores();
            showResultText(scores.winnerColor, `${scores.winnerName} wins by ${scores.diff} points!`, scores);
        }

        function showResultText(winner, desc, scores = null) {
            const panel = document.getElementById('result-text-panel');
            const isPlayerWinner = (playerColor === winner);
            document.getElementById('result-title').textContent = isPlayerWinner ? `🏆 Victory! (${desc})` : `🍵 Defeat (${desc})`;

            const details = document.getElementById('score-details');
            if (scores) {
                details.innerHTML = `
                    <div>⚫ Black Total: <b>${scores.blackScore.toFixed(1)} pts</b> (Stones: ${scores.blackStones}, Territory: ${scores.blackTerritory}, Captures: ${scores.blackCaptures})</div>
                    <div>⚪ White Total: <b>${scores.whiteScore.toFixed(1)} pts</b> (Stones: ${scores.whiteStones}, Territory: ${scores.whiteTerritory}, Captures: ${scores.whiteCaptures}, Komi: ${scores.komi})</div>
                `;
            } else {
                details.innerHTML = `<div>${desc}</div>`;
            }

            panel.classList.remove('hidden');
        }

        function updateModeLabel() {
            const sizeText = boardSize === 9 ? '9x9 Beginner' : boardSize === 13 ? '13x13 Medium' : '19x19 Standard';
            document.getElementById('hud-mode-label').textContent = `${sizeText} · Lv. ${aiDifficulty}`;
            const caption = document.getElementById('diff-caption');
            if (caption) {
                caption.textContent = `Level ${aiDifficulty} · ${LEVEL_LABELS[aiDifficulty] || 'Balanced'}`;
            }
        }

        function updateHUD() {
            updateModeLabel();
            document.getElementById('captures-black').textContent = `Captures: ${captures[1]}`;
            document.getElementById('captures-white').textContent = `Captures: ${captures[2]}`;

            const p1Label = document.getElementById('p1-label');
            const p2Label = document.getElementById('p2-label');

            if (playerColor === 1) {
                p1Label.textContent = "Black (You)";
                p2Label.textContent = `White (AI Lv.${aiDifficulty})`;
            } else {
                p1Label.textContent = `Black (AI Lv.${aiDifficulty})`;
                p2Label.textContent = "White (You)";
            }

            const bBox = document.getElementById('player-black-box');
            const wBox = document.getElementById('player-white-box');

            if (turn === 1) {
                bBox.className = 'flex items-center gap-2 bg-[#2e1d12] border-2 border-amber-400 px-3 py-1 rounded-xl shadow-[0_0_12px_rgba(251,191,36,0.4)] transition-all';
                wBox.className = 'flex items-center gap-2 bg-[#1a120b]/80 border border-amber-800/40 px-3 py-1 rounded-xl opacity-65 transition-all';
            } else {
                bBox.className = 'flex items-center gap-2 bg-[#1a120b]/80 border border-amber-800/40 px-3 py-1 rounded-xl opacity-65 transition-all';
                wBox.className = 'flex items-center gap-2 bg-[#2e1d12] border-2 border-amber-400 px-3 py-1 rounded-xl shadow-[0_0_12px_rgba(251,191,36,0.4)] transition-all';
            }
        }

        // --- Traditional Board & Stone Rendering Engine ---
        function draw() {
            ctx.clearRect(0, 0, width, height);

            // 1. Dark traditional wood table background
            const bgGrad = ctx.createRadialGradient(width / 2, height / 2, 50, width / 2, height / 2, Math.max(width, height) * 0.75);
            bgGrad.addColorStop(0, '#3d281a');
            bgGrad.addColorStop(1, '#180e08');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            const startX = boardOffsetX;
            const startY = boardOffsetY;
            const gridSpan = (boardSize - 1) * cellSize;
            const boardMargin = cellSize * 0.65;
            const boardLeft = startX - boardMargin;
            const boardTop = startY - boardMargin;
            const boardTotalSize = gridSpan + boardMargin * 2;

            // 2. Kaya wood board body & drop shadow
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
            ctx.shadowBlur = 28;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 14;

            const woodGrad = ctx.createLinearGradient(boardLeft, boardTop, boardLeft + boardTotalSize, boardTop + boardTotalSize);
            woodGrad.addColorStop(0, '#eab665');
            woodGrad.addColorStop(0.5, '#dc9e47');
            woodGrad.addColorStop(1, '#c4832d');

            ctx.fillStyle = woodGrad;
            ctx.beginPath();
            ctx.roundRect(boardLeft, boardTop, boardTotalSize, boardTotalSize, 6);
            ctx.fill();
            ctx.restore();

            // 3D bottom edge thickness
            ctx.fillStyle = '#8c5819';
            ctx.beginPath();
            ctx.roundRect(boardLeft, boardTop + boardTotalSize - 4, boardTotalSize, 9, [0, 0, 6, 6]);
            ctx.fill();

            // 3. Subtle wood grain texture
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(boardLeft, boardTop, boardTotalSize, boardTotalSize, 6);
            ctx.clip();

            ctx.strokeStyle = 'rgba(138, 82, 20, 0.14)';
            ctx.lineWidth = 1.5;
            const grainCount = 28;
            for (let i = 0; i < grainCount; i++) {
                const gx = boardLeft + (boardTotalSize / grainCount) * i;
                ctx.beginPath();
                ctx.moveTo(gx, boardTop);
                ctx.bezierCurveTo(
                    gx + Math.sin(i * 0.7) * 14, boardTop + boardTotalSize * 0.33,
                    gx - Math.cos(i * 0.5) * 14, boardTop + boardTotalSize * 0.66,
                    gx + Math.sin(i * 0.3) * 8, boardTop + boardTotalSize
                );
                ctx.stroke();
            }

            // Subtle inner bevel highlight
            ctx.strokeStyle = 'rgba(255, 240, 200, 0.35)';
            ctx.lineWidth = 2;
            ctx.strokeRect(boardLeft + 1, boardTop + 1, boardTotalSize - 2, boardTotalSize - 2);
            ctx.restore();

            // 4. Grid lines (slightly thicker outer border)
            ctx.strokeStyle = '#1f160f';
            for (let i = 0; i < boardSize; i++) {
                const isEdge = (i === 0 || i === boardSize - 1);
                ctx.lineWidth = isEdge ? (boardSize === 19 ? 1.8 : 2.2) : (boardSize === 19 ? 1.0 : 1.3);

                const pos = startX + i * cellSize;
                ctx.beginPath();
                ctx.moveTo(pos, startY);
                ctx.lineTo(pos, startY + gridSpan);
                ctx.stroke();

                const hPos = startY + i * cellSize;
                ctx.beginPath();
                ctx.moveTo(startX, hPos);
                ctx.lineTo(startX + gridSpan, hPos);
                ctx.stroke();
            }

            // 5. Hoshi (Star points)
            const hoshiPoints = boardSize === 9 ? [
                { r: 2, c: 2 }, { r: 2, c: 6 },
                { r: 4, c: 4 },
                { r: 6, c: 2 }, { r: 6, c: 6 }
            ] : boardSize === 13 ? [
                { r: 3, c: 3 }, { r: 3, c: 9 },
                { r: 6, c: 6 },
                { r: 9, c: 3 }, { r: 9, c: 9 }
            ] : [
                { r: 3, c: 3 }, { r: 3, c: 9 }, { r: 3, c: 15 },
                { r: 9, c: 3 }, { r: 9, c: 9 }, { r: 9, c: 15 },
                { r: 15, c: 3 }, { r: 15, c: 9 }, { r: 15, c: 15 }
            ];

            ctx.fillStyle = '#17110c';
            hoshiPoints.forEach(pt => {
                const px = startX + pt.c * cellSize;
                const py = startY + pt.r * cellSize;
                ctx.beginPath();
                ctx.arc(px, py, boardSize === 19 ? 3.2 : 4.2, 0, Math.PI * 2);
                ctx.fill();
            });

            // 6. Placed Black / White stones
            if (board && board.length === boardSize) {
                for (let r = 0; r < boardSize; r++) {
                    if (!board[r]) continue;
                    for (let c = 0; c < boardSize; c++) {
                        const val = board[r][c];
                        if (val !== 0 && val !== undefined) {
                            const px = startX + c * cellSize;
                            const py = startY + r * cellSize;
                            drawStone(px, py, val === 1 ? 'black' : 'white');
                        }
                    }
                }
            }

            // 7. Hover placement preview
            if (hoverCoord && !gameOver && turn === playerColor && isValidMove(hoverCoord.r, hoverCoord.c, playerColor)) {
                const px = startX + hoverCoord.c * cellSize;
                const py = startY + hoverCoord.r * cellSize;
                ctx.save();
                ctx.globalAlpha = 0.45;
                drawStone(px, py, playerColor === 1 ? 'black' : 'white');
                ctx.restore();
            }

            // 8. Last move marker
            if (lastMove) {
                const lx = startX + lastMove.c * cellSize;
                const ly = startY + lastMove.r * cellSize;
                const stoneVal = board[lastMove.r][lastMove.c];
                ctx.strokeStyle = stoneVal === 1 ? '#f87171' : '#dc2626';
                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.arc(lx, ly, cellSize * 0.22, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        // Traditional Go stones (Slate Black & Clam Shell White)
        function drawStone(x, y, color) {
            ctx.save();
            const radius = cellSize * 0.46;

            // Stone shadow on the board
            ctx.shadowColor = 'rgba(15, 10, 5, 0.52)';
            ctx.shadowBlur = radius * 0.35;
            ctx.shadowOffsetX = radius * 0.14;
            ctx.shadowOffsetY = radius * 0.18;

            const grad = ctx.createRadialGradient(
                x - radius * 0.32, y - radius * 0.32, radius * 0.06,
                x, y, radius
            );

            if (color === 'black') {
                grad.addColorStop(0, '#57534e');
                grad.addColorStop(0.28, '#262626');
                grad.addColorStop(0.75, '#121212');
                grad.addColorStop(1, '#050505');
            } else {
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.55, '#f5f3ef');
                grad.addColorStop(0.88, '#dcd6cb');
                grad.addColorStop(1, '#bfb7a8');
            }

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();

            // Subtle shell grain lines on white stones
            if (color === 'white') {
                ctx.shadowColor = 'transparent';
                ctx.strokeStyle = 'rgba(205, 198, 185, 0.35)';
                ctx.lineWidth = 0.8;
                for (let offset = -radius * 0.45; offset <= radius * 0.45; offset += radius * 0.22) {
                    const halfChord = Math.sqrt(Math.max(0, (radius * 0.82) ** 2 - offset ** 2));
                    ctx.beginPath();
                    ctx.moveTo(x - halfChord, y + offset);
                    ctx.lineTo(x + halfChord, y + offset);
                    ctx.stroke();
                }
            }

            ctx.restore();
        }

        function getBoardCoord(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const startX = boardOffsetX;
            const startY = boardOffsetY;

            let closestR = -1;
            let closestC = -1;
            let minDst = Infinity;

            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    const px = startX + c * cellSize;
                    const py = startY + r * cellSize;
                    const dst = Math.hypot(x - px, y - py);
                    if (dst < minDst && dst < cellSize * 0.65) {
                        minDst = dst;
                        closestR = r;
                        closestC = c;
                    }
                }
            }

            if (closestR !== -1 && closestC !== -1) {
                return { r: closestR, c: closestC };
            }
            return null;
        }

        // --- Event Listeners ---
        canvas.addEventListener('pointermove', (e) => {
            if (gameOver || turn !== playerColor) {
                hoverCoord = null;
                return;
            }
            hoverCoord = getBoardCoord(e.clientX, e.clientY);
        });

        canvas.addEventListener('pointerleave', () => {
            hoverCoord = null;
        });

        canvas.addEventListener('pointerdown', (e) => {
            if (gameOver || turn !== playerColor) return;
            sound.init();
            const coord = getBoardCoord(e.clientX, e.clientY);
            if (coord) {
                playMove(coord.r, coord.c, playerColor);
            }
        });

        document.querySelectorAll('.diff-btn').forEach(buttonItem => {
            buttonItem.addEventListener('click', () => {
                document.querySelectorAll('.diff-btn').forEach(b => {
                    b.classList.remove('border-2', 'border-amber-200');
                    b.classList.add('opacity-75');
                });
                buttonItem.classList.remove('opacity-75');
                buttonItem.classList.add('border-2', 'border-amber-200');
                aiDifficulty = parseInt(buttonItem.getAttribute('data-diff'), 10);
                updateModeLabel();
            });
        });

        document.querySelectorAll('.color-btn').forEach(buttonItem => {
            buttonItem.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => {
                    b.classList.remove('border-2', 'border-amber-200');
                    b.classList.add('opacity-75');
                });
                buttonItem.classList.remove('opacity-75');
                buttonItem.classList.add('border-2', 'border-amber-200');
                playerColor = parseInt(buttonItem.getAttribute('data-color'), 10);
            });
        });

        document.querySelectorAll('.size-btn').forEach(buttonItem => {
            buttonItem.addEventListener('click', () => {
                document.querySelectorAll('.size-btn').forEach(b => {
                    b.classList.remove('border-2', 'border-amber-200');
                    b.classList.add('opacity-75');
                });
                buttonItem.classList.remove('opacity-75');
                buttonItem.classList.add('border-2', 'border-amber-200');
                boardSize = parseInt(buttonItem.getAttribute('data-size'), 10);
                updateModeLabel();
            });
        });

        document.getElementById('btn-start').addEventListener('click', () => {
            document.getElementById('modal-menu').classList.add('hidden');
            initBoard();
        });

        document.getElementById('btn-menu-toggle').addEventListener('click', () => {
            document.getElementById('modal-menu').classList.remove('hidden');
        });

        document.getElementById('btn-pass').addEventListener('click', passTurn);
        document.getElementById('btn-resign').addEventListener('click', resignGame);
        document.getElementById('btn-mute').addEventListener('click', (e) => {
            const muted = sound.toggleMute();
            e.currentTarget.textContent = muted ? '🔇' : '🔊';
        });

        document.getElementById('btn-result-retry').addEventListener('click', () => {
            document.getElementById('result-text-panel').classList.add('hidden');
            initBoard();
        });

        document.getElementById('btn-result-menu').addEventListener('click', () => {
            document.getElementById('result-text-panel').classList.add('hidden');
            document.getElementById('modal-menu').classList.remove('hidden');
        });

        function gameLoop() {
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('resize', resizeCanvas);
        window.onload = () => {
            initBoard();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
